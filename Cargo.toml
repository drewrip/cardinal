[package]
name = "cardinal"
version = "0.1.0"
edition = "2024"

[dependencies]
datafusion = "55.1.0"
datafusion-proto = { version = "55.1.0", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
z3 = "0.21.1"

[dev-dependencies]
async-trait = "0.1.92"
futures = "0.3.34"
sqlser = { git = "https://github.com/drewrip/sqlser" }

[workspace]
members = [".", "cardinal-debug"]
