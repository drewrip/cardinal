[package]
name = "cardinal"
version = "0.1.0"
edition = "2024"

[dependencies]
datafusion = "55.1.0"
datafusion-proto = { version = "55.1.0", features = ["json"] }
rayon = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
snowflake-explain = { git = "https://github.com/drewrip/snowflake-explain", rev = "c1216a0fd49fb13ff6a2d20462a23dd351a19ce0" }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
z3 = { version = "0.21.1", features = ["gh-release"] }

[dev-dependencies]
async-trait = "0.1.92"
futures = "0.3.34"
sqlser = { git = "https://github.com/drewrip/sqlser" }

[workspace]
members = [".", "cardinal-cli", "cardinal-eval"]
