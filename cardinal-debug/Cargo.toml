[package]
name = "cardinal-debug"
version = "0.1.0"
edition = "2024"
description = "Dumps cardinal's Z3 constraints and renders them as ASCII or HTML"

[dependencies]
cardinal = { path = ".." }
clap = { version = "4.5", features = ["derive"] }
datafusion = "55.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
