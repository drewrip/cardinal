[package]
name = "cardinal-eval"
version = "0.1.0"
edition = "2024"
description = "Accuracy evaluations of cardinal's bounds over prebaked benchmarks"
publish = false

[[bin]]
name = "cardinal-eval"
path = "src/main.rs"

[[bin]]
name = "operator-truth"
path = "prepare/operator_truth.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1.92"
cardinal = { path = ".." }
clap = { version = "4.5", features = ["derive"] }
datafusion = "55.1.0"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
